id: no-trigger-trivial-change
name: No trigger on trivial change
description: Does NOT trigger when user wants to make a trivial change to an existing skill.
inputs:
  prompt: |
    Can you fix a typo in the ask-questions SKILL.md file?
expected:
  should_trigger: false
graders:
  - type: trigger
    name: should-not-trigger-skill-architect
    config:
      skill_path: skills/skills-meta/skill-architect
      mode: negative
      threshold: 0.4
