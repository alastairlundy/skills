id: no-trigger-resolvable
name: No trigger on resolvable question
description: Does NOT trigger when the LLM can resolve the answer from context, code, or safe inference.
inputs:
  prompt: |
    I'm using C# 12 with .NET 8. What's the right way to declare a primary constructor for a record?
expected:
  should_trigger: false
graders:
  - type: trigger
    name: should-not-trigger-ask-questions
    config:
      skill_path: skills/alignment/ask-questions
      mode: negative
      threshold: 0.4
