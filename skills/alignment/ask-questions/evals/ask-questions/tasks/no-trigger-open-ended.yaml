id: no-trigger-open-ended
name: No trigger on open-ended question
description: Does NOT trigger when the LLM is about to call ask_question for an open-ended exploratory question.
inputs:
  prompt: |
    Tell me about the different approaches to handling state in distributed systems.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: should-not-trigger-ask-questions
    config:
      skill_path: skills/alignment/ask-questions
      mode: negative
      threshold: 0.4
