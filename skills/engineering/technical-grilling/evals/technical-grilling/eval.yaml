name: technical-grilling
description: Evaluates technical-grilling skill trigger discipline and performance for technical/code decisions (concept alignment and implementation planning)
skill: technical-grilling
version: "1.0"

config:
  trials_per_task: 1
  timeout_seconds: 120
  executor: copilot-sdk

tasks:
  - "tasks/*.yaml"

program_graders:
  - name: ledger-record-appended
    description: >
      Verifies the post-pick step wrote a new Dxxx or Txxx record to the
      Decision Ledger file with a Driver field, confirmed the new record
      is the last record in its stream, and the file has both sentinels
      (next-d, next-t).
    config:
      command: "powershell"
      args:
        - "-NoProfile"
        - "-NonInteractive"
        - "-ExecutionPolicy"
        - "Bypass"
        - "-File"
        - "evals/technical-grilling/scripts/check-ledger-record.ps1"
      timeout: 30
  - name: no-citation-litter
    description: >
      Verifies no Dxxx/Txxx IDs or DECISIONS-*.md filenames leaked into
      repository files other than the Decision Ledger and the
      Implementation Blueprint (source code, comments, docstrings,
      commit messages, README, other docs).
    config:
      command: "powershell"
      args:
        - "-NoProfile"
        - "-NonInteractive"
        - "-ExecutionPolicy"
        - "Bypass"
        - "-File"
        - "evals/technical-grilling/scripts/check-no-citation-litter.ps1"
      timeout: 60
