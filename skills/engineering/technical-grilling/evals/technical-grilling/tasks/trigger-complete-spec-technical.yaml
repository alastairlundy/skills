id: trigger-complete-spec-technical
name: Trigger on complete spec needing technical decisions
description: Triggers when user has a complete spec and needs technical implementation decisions.
inputs:
  prompt: |
    Here is the spec for our order service. We need to decide between using .NET 8 or .NET 9, and whether to use Entity Framework or Dapper. Help me resolve the technical foundation.
expected:
  should_trigger: true
graders:
  - type: trigger
    name: should-trigger-technical-grilling
    config:
      skill_path: skills/engineering/technical-grilling
      mode: positive
      threshold: 0.5
