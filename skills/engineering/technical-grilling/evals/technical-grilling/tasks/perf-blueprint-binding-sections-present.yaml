id: perf-blueprint-binding-sections-present
type: performance
description: Implementation Blueprint carries Scope Binding (with traceability boundary) and Ledger Reference sections with section-level filename#Dxxx/Txxx citation groups. No fabricated section numbers, step counts, or 'section N of' framing.
input: |
  Spec at docs/prds/feature-x.md: build a CLI tool that watches a directory for new markdown files and indexes them into SQLite. Run technical-grilling.
assertion: |
  The Implementation Blueprint includes a Scope Binding section (Linked Spec, Decision Ledger path, single-spec validity notice, and the traceability boundary telling implementers not to copy citations into code or commit messages) and a Ledger Reference section listing every cited Dxxx/Txxx record. Each file section cites the set of records it satisfies once at the section level; body statements carry no per-statement inline citations. Output does not contain fabricated section numbers, invented step counts, or 'section N of M' style framing (e.g., 'section 3 of 5', 'step 5 of 6').
