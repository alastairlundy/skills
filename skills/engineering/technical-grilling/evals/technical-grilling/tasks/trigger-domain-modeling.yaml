id: trigger-domain-modeling
name: Trigger on domain modeling / bounded context question
description: Triggers for a domain modeling or terminology alignment question (bounded context).
inputs:
  prompt: |
    What's the bounded context for orders vs invoices in a multi-tenant SaaS?
expected:
  should_trigger: true
graders:
  - type: trigger
    name: should-trigger-technical-grilling
    config:
      skill_path: skills/engineering/technical-grilling
      mode: positive
      threshold: 0.4
