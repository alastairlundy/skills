id: perf-interfaces-one-type-per-turn
type: performance
description: Interface & Model Branch (Step 3) introduces types one at a time with a visible running checklist, and applies record-level resolution for each type rather than a single 'approve the interface spec as written' bulk-append covering all types.
input: |
  Spec at docs/prds/order-service.md: order service with Order, OrderLine, Customer, Address, Payment, Shipment. Run technical-grilling through to interfaces.
assertion: |
  Step 3 output introduces types one at a time. The output contains a visible running checklist of types introduced and remaining (e.g., 'Introduced: A, B, C — remaining: D, E, F'). Each type's record is resolved individually; output does not present a single bulk append covering all types at once (e.g., 'the interface spec is recorded as written for Order, OrderLine, Customer, Address, Payment, Shipment' appended as one unlabeled block). The per-record approval turn still applies per type (`references/decision-ledger.md`), which is type-by-type, not one bulk gate.
