id: no-trigger-vague-plan
name: No trigger on vague plan
description: Does NOT trigger on a bare 'plan' mention with no spec/PRD present.
inputs:
  prompt: |
    I have a plan for a todo app.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: should-not-trigger-technical-grilling
    config:
      skill_path: skills/engineering/technical-grilling
      mode: negative
      threshold: 0.4
