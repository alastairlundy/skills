id: perf-keep-a-changelog-order
type: performance
description: Category headings (H4) appear in the Keep-a-Changelog order, inside H3 sub-project sections, with no emoji prefixes.
input: |
  Generate a changelog for the repo between v1.0.0 and HEAD. The repo has commits spanning all categories (added, changed, deprecated, removed, fixed, security).
assertion: |
  Within the version section (## [<tag>] - <date>), the H3 sub-project section contains category headings in this order: Added, Changed, Deprecated, Removed, Fixed, Security. No heading contains an emoji, and no "Documentation" or "Non Source Code" heading is present.
