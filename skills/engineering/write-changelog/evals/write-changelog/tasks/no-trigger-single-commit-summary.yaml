id: no-trigger-single-commit-summary
name: No trigger on single commit summary
description: Does NOT trigger when user asks for a summary of a single commit.
inputs:
  prompt: |
    Summarize what changed in commit abc1234.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: should-not-trigger-write-changelog
    config:
      skill_path: skills/engineering/write-changelog
      mode: negative
      threshold: 0.4
