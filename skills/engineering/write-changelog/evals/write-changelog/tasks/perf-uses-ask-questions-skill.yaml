id: perf-uses-ask-questions-skill
name: Step 4 clarification uses ask-questions four-gate procedure
description: Step 4's clarification goes through the ask-questions four-gate procedure rather than a bare 3-option question.
tags:
  - performance
inputs:
  prompt: |
    Generate a changelog for the repo between v1.0.0 and HEAD. (The repo structure is ambiguous between single-project and monorepo; treat this as an interactive run.)
graders:
  - type: prompt
    name: uses-ask-questions-four-gates
    config:
      prompt: |
        Judge the task trace against this requirement:

        Output's trace shows the ask-questions skill's four-gate procedure (trigger, fit, construct, validate) being applied before the "Global / All Packages / All Projects" question is presented. The question is not a bare one-shot — the trace evidences gate-by-gate handling (e.g., a fit check confirming the question is necessary, a construct step selecting recommended options, and a validate step confirming the question is answerable from the offered choices).

        Call set_waza_grade_pass only if the trace fully satisfies the requirement. Otherwise call set_waza_grade_fail with a short reason.
