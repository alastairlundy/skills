id: no-trigger-non-ticket-work
name: No trigger on non-ticket work
description: Does NOT trigger on ad-hoc refactor or non-ticket implementation work.
inputs:
  prompt: |
    Refactor the user service to use the new repository pattern. No tickets for this.
expected:
  should_trigger: false
graders:
  - type: trigger
    name: should-not-trigger-implement-tickets
    config:
      skill_path: skills/engineering/implement-tickets
      mode: negative
      threshold: 0.4
